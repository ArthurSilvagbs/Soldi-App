name: CI develop

# Pipeline rápida: feedback imediato enquanto se desenvolve.
# Compila, roda todos os testes (Testcontainers sobe o Postgres) e empacota.

on:
  push:
    branches: [develop]
    paths: ['SoldiAPI/**', '.github/workflows/ci-develop.yml']
  pull_request:
    branches: [develop]
    paths: ['SoldiAPI/**', '.github/workflows/ci-develop.yml']

permissions:
  contents: read

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SoldiAPI
    env:
      # Valor fictício, só para o contexto do Spring subir nos testes.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: mvn -B -ntp verify

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: SoldiAPI/target/surefire-reports
          if-no-files-found: ignore
