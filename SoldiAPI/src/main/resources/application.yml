spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: SoldiAPI
  datasource:
    url: jdbc:postgresql://localhost:5433/soldi_db
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
jwt:
  secret: ${JWT_SECRET}